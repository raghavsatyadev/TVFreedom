plugins {
    id 'com.android.application'
}

// Personal settings (screensaver place and calendars) live in local.properties, which is not in git.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
// -Ptvhome.noLocal builds a copy without them (the one bundled into the TVFreedom app, which sends its own at runtime).
if (localFile.exists() && !project.hasProperty('tvhome.noLocal')) localFile.withInputStream { localProps.load(it) }
// resValue strings go through aapt, so escape what it treats specially (backslash, quotes, a leading @ or ?).
def local = { String key ->
    def v = (localProps.getProperty(key, '') ?: '').replace('\\', '\\\\').replace('"', '\\"').replace("'", "\\'")
    v.startsWith('@') || v.startsWith('?') ? '\\' + v : v
}

// The TVFreedom copy builds into its own folder so it never replaces the personal debug APK.
if (project.hasProperty('tvhome.noLocal')) layout.buildDirectory = file('build-tvfreedom')

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 6
        versionName '2.4'
        resValue 'string', 'weather_place', local('tvhome.weather.place')
        resValue 'string', 'weather_latitude', local('tvhome.weather.latitude')
        resValue 'string', 'weather_longitude', local('tvhome.weather.longitude')
        resValue 'string', 'dream_calendars', local('tvhome.dream.calendars')
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
