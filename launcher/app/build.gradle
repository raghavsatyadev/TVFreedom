plugins {
    id 'com.android.application'
}

// Personal settings (screensaver place and calendars) live in local.properties, which is not in git.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
// -Ptvfreedom.noLocal builds a copy without them (the one bundled into the TVFreedom app, which sends its own at runtime).
if (localFile.exists() && !project.hasProperty('tvfreedom.noLocal')) localFile.withInputStream { localProps.load(it) }
// resValue strings go through aapt, so escape what it treats specially (backslash, quotes, a leading @ or ?).
def local = { String key ->
    def v = (localProps.getProperty(key, '') ?: '').replace('\\', '\\\\').replace('"', '\\"').replace("'", "\\'")
    v.startsWith('@') || v.startsWith('?') ? '\\' + v : v
}

// The TVFreedom copy builds into its own folder so it never replaces the personal debug APK.
if (project.hasProperty('tvfreedom.noLocal')) layout.buildDirectory = file('build-tvfreedom')

android {
    namespace 'io.github.raghavsatyadev.tvfreedom.home'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.raghavsatyadev.tvfreedom.home'
        minSdk 26
        targetSdk 29
        versionCode 12
        versionName '2.10'
        resValue 'string', 'weather_place', local('tvfreedom.weather.place')
        resValue 'string', 'weather_latitude', local('tvfreedom.weather.latitude')
        resValue 'string', 'weather_longitude', local('tvfreedom.weather.longitude')
        resValue 'string', 'dream_calendars', local('tvfreedom.dream.calendars')
    }

    // Google's material-color-utilities, vendored as-is (Apache-2.0, see src/thirdParty/java/README.md).
    sourceSets.main.java.srcDirs += 'src/thirdParty/java'
    buildTypes {
        // TVs get the release build (not debuggable, R8-optimised: faster on low-end boxes). It is signed with the
        // debug key so it installs over the debug copies already on TVs; the launcher is never published.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
